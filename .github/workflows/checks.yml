name: R and browser checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: 'TRUE'
      RENV_CONFIG_PAK_ENABLED: 'FALSE'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.2'
          use-public-rspm: true
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libuv1-dev libx11-dev zlib1g-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: R reference and regression tests
        run: Rscript tests/run.R
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: End-to-end checks
        run: python tests/browser_smoke.py
